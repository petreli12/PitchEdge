[project]
name = "pitchedge"
version = "0.1.0"
description = "A publicly-calibrated World Cup prediction engine and content product."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "statsmodels",
    "sqlalchemy",
    "psycopg[binary]",
    "streamlit",
    "pillow",
    "matplotlib",
    "python-dotenv",
    "requests",
    "anthropic",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pitchedge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.uv]
package = true
